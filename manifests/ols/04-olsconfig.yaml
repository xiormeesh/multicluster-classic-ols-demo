apiVersion: ols.openshift.io/v1alpha1
kind: OLSConfig
metadata:
  name: cluster
spec:
  llm:
    providers:
      - name: openai
        type: openai
        credentialsSecretRef:
          name: credentials
        url: https://api.openai.com/v1
        models:
          - name: gpt-5.4-mini
  ols:
    defaultModel: gpt-5.4-mini
    defaultProvider: openai
    logLevel: INFO
    # Disable the built-in MCP sidecar — we use a standalone MCP server
    # with kubeconfig provider for multicluster support.
    introspectionEnabled: false
  featureGates:
    - MCPServer
  mcpServers:
    - name: multicluster-mcp
      url: http://openshift-mcp-server.openshift-lightspeed.svc:8080/mcp
      timeout: 120
