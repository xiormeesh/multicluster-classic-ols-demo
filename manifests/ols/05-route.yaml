apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: lightspeed-app-server
  namespace: openshift-lightspeed
  labels:
    app: ols
spec:
  port:
    targetPort: 8443-tcp
  tls:
    insecureEdgeTerminationPolicy: Redirect
    termination: reencrypt
  to:
    kind: Service
    name: lightspeed-app-server
    weight: 100
  wildcardPolicy: None
