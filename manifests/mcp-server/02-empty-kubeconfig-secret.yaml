apiVersion: v1
kind: Secret
metadata:
  name: mcp-kubeconfig
  namespace: openshift-lightspeed
type: Opaque
stringData:
  kubeconfig: |
    apiVersion: v1
    kind: Config
    clusters:
    - name: local
      cluster:
        server: https://kubernetes.default.svc
        insecure-skip-tls-verify: true
    contexts:
    - name: local
      context:
        cluster: local
        user: local
    users:
    - name: local
      user: {}
    current-context: local
